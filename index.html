<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clean-room browser reimplementation of Trigger Knight"
    />
    <title>Trigger Knight</title>
  </head>
  <body>
    <main class="foundation">
      <h1>Trigger Knight</h1>
      <canvas id="game-canvas" role="img" aria-label="Trigger Knight game view">
        Trigger Knight requires a browser with Canvas 2D support.
      </canvas>
      <p class="status" id="game-status" data-testid="game-status">Step 0</p>
      <div class="controls">
        <button id="advance-run" type="button">Advance run</button>
        <button id="purchase-current-encounter" type="button" disabled>
          Purchase current shop
        </button>
        <button id="use-carried-item" type="button" disabled>
          Use carried item
        </button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
