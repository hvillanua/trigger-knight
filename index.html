<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clean-room browser reimplementation of Trigger Knight"
    />
    <title>Trigger Knight</title>
  </head>
  <body>
    <main class="foundation">
      <h1>Trigger Knight</h1>
      <p class="status" data-testid="foundation-status">
        Project foundation ready
      </p>
      <canvas
        id="game-canvas"
        role="img"
        aria-label="Trigger Knight game view"
      >
        Trigger Knight requires a browser with Canvas 2D support.
      </canvas>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
