name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: continuous-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect code-affecting changes
        id: code_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi

          code_pattern='^(src/|tests/|build/|\.github/workflows/|\.node-version$|\.npmrc$|\.prettierignore$|\.prettierrc(?:\.[^.]+)?$|package(?:-lock)?\.json$|tsconfig(?:\.[^.]+)?\.json$)|\.(?:js|mjs|cjs|ts|mts|cts|json|jsonc|yml|yaml|css|scss|html|py|sh)$'
          if printf '%s\n' "$changed_files" | grep -Eq "$code_pattern"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.code_changes.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate pinned npm version
        if: steps.code_changes.outputs.code == 'true'
        run: corepack enable npm

      - name: Restore locked dependencies
        if: steps.code_changes.outputs.code == 'true'
        run: npm ci

      - name: Install Chromium and system dependencies
        if: steps.code_changes.outputs.code == 'true'
        run: npm run setup:browser -- --with-deps

      - name: Run complete repository validation
        if: steps.code_changes.outputs.code == 'true'
        run: npm run validate
